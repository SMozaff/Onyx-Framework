name: onyx_mobile
description: ONYX local-first mission operations client for iOS and Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.0.0
  ffi: ^2.1.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.0
  connectivity_plus: ^6.0.0
  # workmanager 0.5.2's Android source references the v1-embedding shim
  # classes (ShimPluginRegistry, PluginRegistrantCallback), which newer
  # Flutter/AGP toolchains no longer ship — confirmed in CI (session 6 audit
  # finding #23) and matches fluttercommunity/flutter_workmanager#586/#588.
  # 0.6.0 is the first release with that shim removed while keeping the
  # initialize/registerPeriodicTask API this project calls unchanged; 0.9.x
  # introduces an unrelated breaking factory-pattern API change we don't need.
  workmanager: ^0.6.0
  background_fetch: ^1.3.0
  # HTTP client for the LAN transport (net/), added alongside the existing
  # FFI/mobile-core transport (bridge/) rather than replacing it — see
  # net/README.md. dio chosen over the plain http package specifically for
  # its interceptor API, needed to mirror web-ui's axios interceptor
  # pattern (client.ts: auth header injection + 401 -> logout) exactly,
  # rather than hand-rolling equivalent logic per request call site.
  dio: ^5.4.0
  # WebSocket client for net/events.dart's /api/events subscription
  # (mirrors web-ui/src/api/events.ts, which uses the browser's built-in
  # WebSocket — Dart has no equivalent built-in, hence this dependency).
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
