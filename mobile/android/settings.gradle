pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    // The Aliyun entries mirror Google's Maven / Maven Central / the Gradle
    // Plugin Portal. They are listed FIRST because dl.google.com is not
    // reachable from the network this is built on, so a leading `google()`
    // just stalls every plugin lookup before the mirror is ever consulted.
    // The direct repositories are kept after them, not replaced: on a network
    // where Google's Maven does resolve, Gradle still falls back to them for
    // anything the mirrors happen not to carry.
    repositories {
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        google(); mavenCentral(); gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "2.0.20" apply false
}

include ":app"
