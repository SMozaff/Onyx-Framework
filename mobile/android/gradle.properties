# Sized for an 8 GB machine. The previous -Xmx4G/-XX:MaxMetaspaceSize=2G
# reserves ~6 GB of commit up front, which this host cannot satisfy (7.8 GB
# RAM + a 1 GB page file = a ~9.8 GB commit limit that is largely spoken for
# before Gradle starts), so the build JVM failed at startup with "insufficient
# memory ... malloc failed" rather than failing on anything in the app.
# Raise these again on a larger machine — they are a host constraint, not a
# property of this project.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Compile Kotlin inside the Gradle JVM instead of forking a second long-lived
# Kotlin daemon that would need its own heap alongside it.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
