# These are the build's real requirements, not any one machine's budget: CI
# runners and normal dev machines have the headroom for them, and starving the
# Kotlin/R8 steps to fit a small host trades a startup failure for a much more
# confusing out-of-memory partway through compilation.
#
# On a host that genuinely cannot commit this much (small RAM plus a small page
# file), override it for that machine only rather than editing this file —
# `GRADLE_OPTS` and `%GRADLE_USER_HOME%\gradle.properties` both take precedence
# and neither is committed:
#     $env:GRADLE_OPTS = "-Xmx1024m -XX:MaxMetaspaceSize=384m"
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
