allprojects {
    // Mirrors first, direct repositories kept as fallback — see the matching
    // comment in settings.gradle for why dl.google.com cannot be relied on
    // here. This block covers dependency resolution; settings.gradle's covers
    // plugin resolution, and both need it independently.
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        google(); mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { project.evaluationDependsOn(":app") }
tasks.register("clean", Delete) { delete rootProject.buildDir }
