plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.onyx"
    compileSdk flutter.compileSdkVersion
    // ndkVersion intentionally not set: this module compiles no native code
    // (no CMakeLists.txt / Android.mk, and src/main/jniLibs does not exist),
    // so declaring it only makes AGP validate an NDK install that nothing
    // here would use. Restore it if mobile-core's .so is ever bundled — see
    // the note in mobile/README about the FFI path needing that library.
    // ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.onyx"
        minSdk 29
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    sourceSets.main.jniLibs.srcDirs += ["src/main/jniLibs"]

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter { source "../.." }

dependencies {
    implementation "androidx.work:work-runtime-ktx:2.9.1"
}
