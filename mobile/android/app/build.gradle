plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.onyx"
    compileSdk flutter.compileSdkVersion
    // Needed even though this module has no CMakeLists.txt:
    // mobile/tool/build_rust_android.sh cross-compiles mobile-core with
    // cargo-ndk into src/main/jniLibs (arm64-v8a, armeabi-v7a, x86_64) before
    // assembly, and cargo-ndk requires a real NDK. jniLibs is generated and
    // gitignored, so its absence in a fresh checkout is not evidence that
    // nothing here is native.
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.onyx"
        minSdk 29
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    sourceSets.main.jniLibs.srcDirs += ["src/main/jniLibs"]

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter { source "../.." }

dependencies {
    implementation "androidx.work:work-runtime-ktx:2.9.1"
}
