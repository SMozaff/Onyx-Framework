[package]
name = "sync-transport-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# A C-ABI-exporting cdylib for Team 5's Swift/Kotlin call sites, plus an
# rlib so this crate can also be exercised from Rust integration tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
sync-transport = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }

[lints.clippy]
all = "warn"
