description = "CRDT taxonomy (OR-Set, LWW-Register, MV-Register, PN-Counter, RGA), append-only causal log, and tombstone GC. Pure domain logic — no I/O, no async runtime. Depends on Team 1's real platform-kernel (per Architectural Ruling Q1, Team 3 Initiation)."

[dependencies]
platform-kernel = { workspace = true }
serde = { workspace = true }
