[package]
name = "todo-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ONYX TodoList/TargetList aggregates: pure domain logic for staff task lists, time-bound targets, list-level verification, and staff loans."

[dependencies]
platform-kernel = { path = "../../kernel/platform-kernel" }
platform-contracts = { path = "../../kernel/platform-contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.0"
