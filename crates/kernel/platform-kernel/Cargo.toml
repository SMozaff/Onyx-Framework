[package]
name = "platform-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ONYX Shared Kernel: identifiers, versioning, causality, authority, time, and domain refs. Infrastructure-free."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
proptest = "1.0"
