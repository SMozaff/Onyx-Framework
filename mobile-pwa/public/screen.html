<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1e3d" />
    <title>ONYX Observer — Launch</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        background: #0a1e3d;
        color: #e8eefc;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        -webkit-tap-highlight-color: transparent;
      }
      .splash {
        padding: 24px;
        max-width: 32rem;
      }
      .logo {
        width: 88px;
        height: 88px;
        margin-bottom: 20px;
        border-radius: 20px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.35);
      }
      .brand { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
      .tagline { margin-top: 8px; font-size: 0.95rem; color: #9db4e6; }
      .enter {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 28px;
        border-radius: 999px;
        background: #2f6fed;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      </style>
  </head>
  <body>
    <div class="splash">
      <img class="logo" src="/icons/icon.svg" alt="ONYX Observer" />
      <div class="brand">ONYX Observer</div>
      <p class="tagline">Read-only mission monitoring for authorized observers.</p>
      <a class="enter" href="/">Continue</a>
    </div>
  </body>
</html>
