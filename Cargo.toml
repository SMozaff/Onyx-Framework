rand = "0.8"
anyhow = "1"

# --- Team 4 (Networking / P2P Transports) additional dependencies ---
# Not previously in the workspace; added here rather than duplicated as
# non-workspace deps in sync-transport's own Cargo.toml, matching the
# existing convention (all shared deps centralized at workspace level).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "platform-verifier", "aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart"] }
url = "2"
# WebPush delivery (RFC 8291/8292): ECDH P-256, AES-128-GCM, ES256 VAPID JWT,
# and RFC 6090 key import — supplied by BoringSSL-derived `ring`.
ring = "0.17"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
libc = "0.2"
objc = "0.2"
jni = "0.21"
rcgen = "0.14"

# --- Password hashing (Audit fix H-01) ---