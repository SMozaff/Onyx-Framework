[advisories]
# cargo-deny 0.20+ treats vulnerability and unsound advisories as errors by default.
# Unmaintained advisories are enforced for direct workspace dependencies.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# cargo-deny 0.20+ denies licenses not present in this explicit allow-list.
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "Unicode-3.0", "Apache-2.0 WITH LLVM-exception", "CDLA-Permissive-2.0", "Unlicense"]

# ONYX workspace crates are intentionally unpublished; third-party dependency
# licensing remains enforced by the allow-list above.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Keep wildcard declarations visible without failing the security gate.
wildcards = "warn"
# Existing workspace/default feature choices are tracked as dependency hygiene,
# while advisory/source/license violations remain fail-closed.
workspace-default-features = "warn"
external-default-features = "warn"

[bans.workspace-dependencies]
# Existing non-workspace declarations are reported as warnings until migrated.
duplicates = "warn"
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Slint packages declare multiple license alternatives in Cargo metadata.
# ONYX selects the royalty-free desktop/mobile/web application license; keep
# that exception scoped to Slint packages instead of globally permitting GPL or
# Slint's paid commercial license identifiers.
[[licenses.exceptions]]
name = "i-slint-backend-selector"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "i-slint-backend-winit"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "i-slint-common"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "i-slint-compiler"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "i-slint-core"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "i-slint-core-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "i-slint-renderer-femtovg"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "i-slint-renderer-skia"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "i-slint-renderer-software"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "slint"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "slint-build"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
name = "slint-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

