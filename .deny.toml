[advisories]
# cargo-deny 0.20+ removed the vulnerability/unsound severity keys:
# vulnerability and unsound advisories are now errors by default.
unmaintained = "all"
yanked = "deny"

[licenses]
# cargo-deny 0.20+ denies licenses not present in this explicit allow-list;
# the former unlicensed = "deny" key was removed from the schema.
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Zlib", "CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
