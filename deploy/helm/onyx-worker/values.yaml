namespace: onyx
replicaCount: 2
image: {repository: ghcr.io/example/onyx-worker, tag: "1.0.0", pullPolicy: IfNotPresent}
secretRef: onyx-worker-secrets
resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}
env:
  RUST_LOG: info
  ONYX_ENV: production
  ONYX_METRICS_BIND: 0.0.0.0:9090
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger-collector.observability.svc:4317
