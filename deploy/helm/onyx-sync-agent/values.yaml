namespace: onyx
replicaCount: 2
image: {repository: ghcr.io/example/onyx-sync-agent, tag: "1.0.0", pullPolicy: IfNotPresent}
secretRef: onyx-sync-agent-secrets
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
env:
  RUST_LOG: info
  ONYX_ENV: production
  ONYX_METRICS_BIND: 0.0.0.0:9090
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger-collector.observability.svc:4317
