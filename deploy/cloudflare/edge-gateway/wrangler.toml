name = "onyx-framework"
main = "src/index.ts"
compatibility_date = "2026-10-09"
workers_dev = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

# Required by Cloudflare Builds when creating a Worker Preview.
[previews]

# The deployment workflow materializes the D1 database_id at deploy time.
# This Worker has no Render origin and does not use Cloudflare Containers.
#
# This file is the production/deploy shape only. For local development use
# wrangler.dev.toml (`npm run dev`, `npm run d1:local`, `npm run check`), which
# carries the D1 binding and the non-secret dev [vars].

[[durable_objects.bindings]]
name = "EVENTS_HUB"
class_name = "EventHub"

[[durable_objects.bindings]]
name = "RELAY_HUB"
class_name = "RelayHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RelayHub"]

[observability]
enabled = true
