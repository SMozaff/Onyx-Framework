name: Otlp Transport Fix

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-build
      - name: Refresh lockfile for the new feature set
        run: |
          cargo metadata --format-version 1 > /dev/null
          git --no-pager diff --stat -- Cargo.lock || true
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore(lock): record opentelemetry-otlp grpc-tonic feature edges"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Compile the OTLP transport change against the refreshed lockfile
        run: cargo check --locked -p observability-adapter --all-targets