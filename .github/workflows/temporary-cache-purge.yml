name: Temporary one-time Actions cache purge

on:
  push:
    branches: [ci/demo-scope-cleanup]
    paths:
      - ".github/workflows/temporary-cache-purge.yml"

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete repository Actions caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GH_REPOSITORY/actions/caches"
          deleted=0
          while true; do
            response="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api?per_page=100&page=1")"
            mapfile -t ids < <(printf '%s' "$response" | jq -r '.actions_caches[].id')
            if (("${#ids[@]}" == 0)); then
              break
            fi
            for id in "${ids[@]}"; do
              curl --fail --silent --show-error -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api/$id" >/dev/null
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted $deleted repository Actions cache entries."
