name: Build

# Verifies that the server backend, the native desktop app (PC platforms),
# and the web client all actually compile on every push/PR -- unlike
# ci.yml's "ONYX Signed Release" workflow, this has no signing/publishing
# steps and no secrets, so it can run on ordinary commits, not just tags.
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-server:
    name: server (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built inside a real Debian container, not just on an Ubuntu
          # runner -- the deployed target is Debian, and a plain
          # ubuntu-24.04 build links against a newer glibc (2.39) than
          # Debian 12 "bookworm" ships (2.36), which would refuse to run
          # on it. Building inside the same base the runtime Dockerfiles
          # already use (debian:bookworm-slim) keeps the two in sync.
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, container: "debian:bookworm-slim"}
          - {os: macos-14, target: aarch64-apple-darwin, container: ""}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, container: ""}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Runs before checkout: a bare debian:bookworm-slim container has
      # no `git`, which actions/checkout@v4 itself shells out to.
      - name: Install build prerequisites (Debian container)
        if: matrix.container != ''
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils build-essential pkg-config git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.97.1", targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: "server-${{ matrix.target }}"}
      - name: Resolve frozen dependency graph
        run: cargo generate-lockfile
      - run: cargo build --locked --release --target ${{ matrix.target }} -p api-server -p worker -p migration-tool -p sync-agent
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p artifacts
          cd "target/${{ matrix.target }}/release"
          for bin in api-server worker migration-tool sync-agent; do
            cp "$bin"* ../../../artifacts/ 2>/dev/null || true
          done
          # cargo also emits *.d dep-info files alongside each binary on
          # some targets -- drop those, only the executables are wanted.
          rm -f ../../../artifacts/*.d
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  build-desktop:
    name: ${{ matrix.app }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # desktop-shell (the main ONYX app) and admin-shell (the separate
        # admin-only Tauri app, see crates/bins/admin-shell/Cargo.toml's
        # description) are each built on all three platforms. Spelled out
        # as a flat list rather than a separate `app:` axis crossed with
        # `include:` -- an include entry that shares no key with another
        # matrix axis gets merged into *every* combination of that axis
        # instead of cross-producing with it, which would silently
        # collapse this to 2 jobs instead of 6.
        include:
          # Same Debian-container rationale as build-server above -- the
          # .deb this produces must actually install and run on Debian,
          # not just on the Ubuntu runner that built it.
          - {app: desktop-shell, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "deb,appimage", container: "debian:bookworm-slim"}
          - {app: desktop-shell, os: macos-14, target: aarch64-apple-darwin, bundles: "dmg", container: ""}
          - {app: desktop-shell, os: windows-2022, target: x86_64-pc-windows-msvc, bundles: "msi,nsis", container: ""}
          - {app: admin-shell, os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "deb,appimage", container: "debian:bookworm-slim"}
          - {app: admin-shell, os: macos-14, target: aarch64-apple-darwin, bundles: "dmg", container: ""}
          - {app: admin-shell, os: windows-2022, target: x86_64-pc-windows-msvc, bundles: "msi,nsis", container: ""}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Runs before checkout: a bare debian:bookworm-slim container has
      # no `git`, which actions/checkout@v4 itself shells out to. Tauri
      # v2 on Linux also links against WebKitGTK -- without these the
      # build below fails with "gdk-3.0 not found" on a bare Debian image.
      - name: Install Tauri native dependencies (GTK/WebKit)
        if: matrix.container != ''
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils build-essential pkg-config git \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev file
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.97.1", targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: "${{ matrix.app }}-${{ matrix.target }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: "npm", cache-dependency-path: "crates/bins/${{ matrix.app }}/ui/package-lock.json"}
      - name: Resolve frozen dependency graph
        run: cargo generate-lockfile
      - name: Install frontend dependencies
        working-directory: crates/bins/${{ matrix.app }}/ui
        run: npm ci
      # No signing secrets here (this workflow runs on every push/PR, not
      # just tags) -- tauri-action ad-hoc-signs / leaves bundles unsigned
      # when APPLE_*/TAURI_SIGNING_* are unset, the same fallback
      # ci.yml's tag-triggered `release-desktop` job documents and relies
      # on when those secrets aren't configured.
      # `projectPath` has no package.json of its own -- the `tauri` CLI
      # is a devDependency of its `ui/` frontend, so plain `npx tauri`
      # can't resolve it from there ("could not determine executable to
      # run"). `--prefix ui` points npx at ui/node_modules while still
      # running from the app's crate dir, where tauri.conf.json is.
      - name: Build and bundle the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          # The AppImage bundler normally mounts its linuxdeploy/appimagetool
          # helpers via FUSE, which a plain container (no /dev/fuse) doesn't
          # have. This forces them to extract-and-run instead, which needs
          # no FUSE support at all.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          projectPath: crates/bins/${{ matrix.app }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tauriScript: npx --prefix ui tauri
      - name: Collect bundle output
        shell: bash
        run: |
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          mkdir -p artifacts
          find "$bundle_dir" -maxdepth 2 -type f \
            \( -iname "*.deb" -o -iname "*.AppImage" -o -iname "*.dmg" \
               -o -iname "*.msi" -o -iname "*.exe" \) \
            -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  build-web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: "npm", cache-dependency-path: web-ui/package-lock.json}
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: web-ui/dist/*
          if-no-files-found: error
