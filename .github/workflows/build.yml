name: Build

# Verifies that the server backend, the native desktop app (PC platforms),
# and the web client all actually compile on every push/PR -- unlike
# ci.yml's "ONYX Signed Release" workflow, this has no signing/publishing
# steps and no secrets, so it can run on ordinary commits, not just tags.
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-server:
    name: server (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: macos-14, target: aarch64-apple-darwin}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.97.1", targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: "server-${{ matrix.target }}"}
      - name: Resolve frozen dependency graph
        run: cargo generate-lockfile
      - run: cargo build --locked --release --target ${{ matrix.target }} -p api-server -p worker -p migration-tool -p sync-agent
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p artifacts
          cd "target/${{ matrix.target }}/release"
          for bin in api-server worker migration-tool sync-agent; do
            cp "$bin"* ../../../artifacts/ 2>/dev/null || true
          done
          # cargo also emits *.d dep-info files alongside each binary on
          # some targets -- drop those, only the executables are wanted.
          rm -f ../../../artifacts/*.d
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  build-desktop:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "deb,appimage"}
          - {os: macos-14, target: aarch64-apple-darwin, bundles: "dmg"}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, bundles: "msi,nsis"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.97.1", targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
        with: {shared-key: "desktop-${{ matrix.target }}"}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: "npm", cache-dependency-path: crates/bins/desktop-shell/ui/package-lock.json}
      # Tauri v2 on Linux links against WebKitGTK -- without these the
      # build below fails with "gdk-3.0 not found" on a bare ubuntu-24.04
      # runner image.
      - name: Install desktop-shell native dependencies (Tauri/GTK)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Resolve frozen dependency graph
        run: cargo generate-lockfile
      - name: Install frontend dependencies
        working-directory: crates/bins/desktop-shell/ui
        run: npm ci
      # No signing secrets here (this workflow runs on every push/PR, not
      # just tags) -- tauri-action ad-hoc-signs / leaves bundles unsigned
      # when APPLE_*/TAURI_SIGNING_* are unset, the same fallback
      # ci.yml's tag-triggered `release-desktop` job documents and relies
      # on when those secrets aren't configured.
      - name: Build and bundle the desktop app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/bins/desktop-shell
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tauriScript: npx tauri
      - name: Collect bundle output
        shell: bash
        run: |
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          mkdir -p artifacts
          find "$bundle_dir" -maxdepth 2 -type f \
            \( -iname "*.deb" -o -iname "*.AppImage" -o -iname "*.dmg" \
               -o -iname "*.msi" -o -iname "*.exe" \) \
            -exec cp {} artifacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  build-web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: "npm", cache-dependency-path: web-ui/package-lock.json}
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-ui
          path: web-ui/dist/*
          if-no-files-found: error
