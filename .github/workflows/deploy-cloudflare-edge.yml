name: Deploy ONYX Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [migration/cloudflare-free-worker]
    paths:
      - 'deploy/cloudflare/edge-gateway/**'
      - '.github/workflows/deploy-cloudflare-edge.yml'

permissions:
  contents: read

concurrency:
  group: onyx-cloudflare-worker-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ONYX_JWT_SECRET: ${{ secrets.ONYX_JWT_SECRET }}
  ONYX_ALLFATHER_EMAIL: so.muzaff@gmail.com
  CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
  CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
  HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
  ONYX_WORKER_URL: https://onyx-framework.soheil-mozaffari.workers.dev

jobs:
  deploy:
    name: Deploy ONYX Cloudflare Worker + D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/cloudflare/edge-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLERK_ISSUER}" || { echo "Missing CLERK_ISSUER"; exit 1; }
          test -n "${CLERK_SECRET_KEY}" || { echo "Missing CLERK_SECRET_KEY"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install Worker dependencies
        run: npm install

      - name: Validate Worker bundle
        run: npm run check

      - name: Ensure free D1 database exists
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          databases="$(npx wrangler d1 list --json)"
          db_id="$(printf '%s' "$databases" | jq -r '(.result // .)[] | select(.name == "onyx-free-db") | .uuid // .database_id' | head -n1)"
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            created="$(npx wrangler d1 create onyx-free-db --json)"
            db_id="$(printf '%s' "$created" | jq -r '(.d1_databases // .result // .)[]? | .database_id // .uuid' | head -n1)"
          fi
          test -n "$db_id" && test "$db_id" != "null"
          echo "database_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Materialize deployment config
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.deploy.toml <<EOF
          name = "onyx-framework"
          main = "src/index.ts"
          compatibility_date = "2026-10-09"
          workers_dev = true

          [observability]
          enabled = true

          [[d1_databases]]
          binding = "DB"
          database_name = "onyx-free-db"
          database_id = "${{ steps.d1.outputs.database_id }}"
          migrations_dir = "migrations"

          [vars]
          ONYX_CORS_ORIGINS = "*"
          ONYX_ALLFATHER_EMAIL = "so.muzaff@gmail.com"
          CLERK_ISSUER = "${CLERK_ISSUER}"
          CLERK_JWKS_URL = "${CLERK_JWKS_URL}"
          HF_S3_ENDPOINT = "https://s3.hf.co/Arronthemalkavian"
          HF_S3_BUCKET = "onyx"
          EOF

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply onyx-free-db --remote --config wrangler.deploy.toml

      - name: Configure JWT secret
        shell: bash
        run: |
          set -euo pipefail
          existing="$(npx wrangler secret list --format json | jq -r '.[] | select(.name == "ONYX_JWT_SECRET") | .name' | head -n1 || true)"
          if [ -z "$existing" ]; then
            secret="${ONYX_JWT_SECRET}"
            if [ -z "$secret" ]; then secret="$(openssl rand -hex 32)"; fi
            printf '%s' "$secret" | npx wrangler secret put ONYX_JWT_SECRET
          fi

      - name: Configure Clerk secret
        shell: bash
        run: printf '%s' "${CLERK_SECRET_KEY}" | npx wrangler secret put CLERK_SECRET_KEY

      - name: Configure optional Hugging Face S3 credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${HF_S3_ACCESS_KEY_ID}" ]; then printf '%s' "${HF_S3_ACCESS_KEY_ID}" | npx wrangler secret put HF_S3_ACCESS_KEY_ID; fi
          if [ -n "${HF_S3_SECRET_ACCESS_KEY}" ]; then printf '%s' "${HF_S3_SECRET_ACCESS_KEY}" | npx wrangler secret put HF_S3_SECRET_ACCESS_KEY; fi

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.deploy.toml

      - name: Verify live Worker health and D1 readiness
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            health="$(curl -fsS --max-time 10 "${ONYX_WORKER_URL}/health" || true)"
            ready="$(curl -sS -o /tmp/onyx-ready.json -w '%{http_code}' --max-time 10 "${ONYX_WORKER_URL}/ready" || true)"
            if printf '%s' "$health" | jq -e '.status == "ok" and .runtime == "cloudflare-workers-free"' >/dev/null 2>&1 && [ "$ready" = "200" ]; then
              echo "Cloudflare Worker is healthy and D1 is ready."
              cat /tmp/onyx-ready.json
              exit 0
            fi
            echo "Attempt $i/30: health=$health ready=$ready"
            sleep 10
          done
          echo "::error::Cloudflare Worker did not become healthy within 5 minutes."
          cat /tmp/onyx-ready.json 2>/dev/null || true
          exit 1

      - name: Verify protected API rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/onyx-api-error.json -w '%{http_code}' --max-time 10 "${ONYX_WORKER_URL}/api/users/hierarchy")"
          test "$status" = "401"
          cat /tmp/onyx-api-error.json
