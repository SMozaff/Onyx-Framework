name: Deploy ONYX Cloudflare Container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onyx-cloudflare-container-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ONYX Axum container through Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare/edge-gateway
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42b2d3f6f1d7b2c3f0f8f6f7a1d4a8e6c4b2 # v7
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install Wrangler and Container SDK
        run: npm install
      - name: Validate ONYX runtime secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.ONYX_DATABASE_URL }}
          ONYX_GOVERNANCE_DATABASE_URL: ${{ secrets.ONYX_GOVERNANCE_DATABASE_URL }}
          ONYX_AUTHORITY_SIGNING_KEY: ${{ secrets.ONYX_AUTHORITY_SIGNING_KEY }}
          ONYX_CORS_ALLOWED_ORIGINS: ${{ secrets.ONYX_CORS_ALLOWED_ORIGINS }}
          CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
          ONYX_BLOB_STORE_S3_ACCESS_KEY_ID: ${{ secrets.ONYX_BLOB_STORE_S3_ACCESS_KEY_ID }}
          ONYX_BLOB_STORE_S3_SECRET_ACCESS_KEY: ${{ secrets.ONYX_BLOB_STORE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL ONYX_GOVERNANCE_DATABASE_URL ONYX_AUTHORITY_SIGNING_KEY ONYX_CORS_ALLOWED_ORIGINS CLERK_ISSUER CLERK_SECRET_KEY CLERK_JWKS_URL ONYX_BLOB_STORE_S3_ACCESS_KEY_ID ONYX_BLOB_STORE_S3_SECRET_ACCESS_KEY; do
            test -n "${!name}" || { echo "Missing GitHub secret for ${name}"; exit 1; }
          done
      - name: Sync ONYX runtime secrets to Cloudflare
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.ONYX_DATABASE_URL }}
          ONYX_GOVERNANCE_DATABASE_URL: ${{ secrets.ONYX_GOVERNANCE_DATABASE_URL }}
          ONYX_AUTHORITY_SIGNING_KEY: ${{ secrets.ONYX_AUTHORITY_SIGNING_KEY }}
          ONYX_CORS_ALLOWED_ORIGINS: ${{ secrets.ONYX_CORS_ALLOWED_ORIGINS }}
          CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
          ONYX_BLOB_STORE_S3_ACCESS_KEY_ID: ${{ secrets.ONYX_BLOB_STORE_S3_ACCESS_KEY_ID }}
          ONYX_BLOB_STORE_S3_SECRET_ACCESS_KEY: ${{ secrets.ONYX_BLOB_STORE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL ONYX_GOVERNANCE_DATABASE_URL ONYX_AUTHORITY_SIGNING_KEY ONYX_CORS_ALLOWED_ORIGINS CLERK_ISSUER CLERK_SECRET_KEY CLERK_JWKS_URL ONYX_BLOB_STORE_S3_ACCESS_KEY_ID ONYX_BLOB_STORE_S3_SECRET_ACCESS_KEY; do
            printf '%s' "${!name}" | npx wrangler secret put "${name}"
          done
      - name: Deploy Worker and Axum Container
        run: npx wrangler deploy
