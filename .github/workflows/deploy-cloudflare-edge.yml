name: Deploy ONYX Cloudflare Edge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onyx-cloudflare-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ONYX edge gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare/edge-gateway
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ONYX_ORIGIN_URL: ${{ secrets.ONYX_ORIGIN_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${ONYX_ORIGIN_URL}" || { echo "Missing ONYX_ORIGIN_URL"; exit 1; }
          case "${ONYX_ORIGIN_URL}" in
            https://*) ;;
            *) echo "ONYX_ORIGIN_URL must use https://"; exit 1 ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install

      - name: Deploy Worker
        run: npx wrangler deploy --var ONYX_ORIGIN_URL:${ONYX_ORIGIN_URL}
