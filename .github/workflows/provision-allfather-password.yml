name: Provision All-Father Password

on:
  workflow_dispatch:
    inputs:
      production_approval:
        description: 'Type exactly: PROVISION __allfather__'
        required: true
        type: choice
        options:
          - 'DO NOT PROVISION'
          - 'PROVISION __allfather__'

permissions:
  contents: read

concurrency:
  group: onyx-allfather-production-provisioning
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ inputs.production_approval == 'PROVISION __allfather__' }}
    name: Provision canonical All-Father password
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/cloudflare/edge-gateway
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/cloudflare/edge-gateway/package-lock.json

      - name: Validate required secret configuration
        shell: bash
        env:
          ONYX_ALLFATHER_USERNAME: ${{ secrets.ONYX_ALLFATHER_USERNAME }}
          ONYX_ALLFATHER_PASSWORD: ${{ secrets.ONYX_ALLFATHER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID Actions secret"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN Actions secret"; exit 1; }
          test -n "${ONYX_ALLFATHER_PASSWORD}" || { echo "::error::Missing ONYX_ALLFATHER_PASSWORD Actions secret"; exit 1; }
          echo "Required secret configuration is present; secret values are not displayed."

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare identity
        run: npx wrangler whoami

      - name: Diagnose D1 read access (read-only, mirrors the provisioning script)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Runs the same kind of invocation as the provisioning script: a
          # generated config with the database ID from `wrangler d1 list`, and
          # a SQL file. The SQL is a constant SELECT. Only the exit code and the
          # first error line are printed, truncated and with long token-like
          # strings masked. No SQL output is printed.
          set +e
          cd deploy/cloudflare/edge-gateway
          LIST=$(npx wrangler d1 list --json 2>/dev/null)
          DBID=$(printf '%s' "${LIST}" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const p = JSON.parse(s);
              const rows = Array.isArray(p) ? p : (p?.result?.databases ?? []);
              const m = rows.filter(d => d?.name === "onyx-free-db");
              process.stdout.write(m.length === 1 ? String(m[0].uuid ?? m[0].database_id ?? "") : "");
            });')
          echo "database ID resolved: $([ -n "${DBID}" ] && echo yes || echo no)"
          if [ -z "${DBID}" ]; then echo "Could not resolve onyx-free-db from wrangler d1 list."; exit 1; fi
          CONF=".wrangler-diag-${RANDOM}.toml"
          { cat wrangler.toml; printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "onyx-free-db"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "${DBID}"; } > "${CONF}"
          SQL="${RUNNER_TEMP}/diag-select.sql"
          printf 'SELECT 1 AS ok;\n' > "${SQL}"
          ERR=$(npx wrangler d1 execute onyx-free-db --remote --config "${CONF}" --file "${SQL}" --json 2>&1 >/dev/null)
          RC=$?
          rm -f "${CONF}" "${SQL}"
          echo "wrangler d1 remote read exit code: ${RC}"
          if [ "${RC}" -ne 0 ]; then
            echo "${ERR}" | grep -v -i "select" | grep -v '^\s*$' | head -1 | cut -c1-200 | sed -E 's/[A-Za-z0-9_-]{24,}/[REDACTED]/g'
            exit 1
          fi
          echo "Remote D1 read succeeded with the provisioning invocation."

      - name: Provision existing canonical principal
        shell: bash
        env:
          ONYX_ALLFATHER_USERNAME: ${{ secrets.ONYX_ALLFATHER_USERNAME }}
          ONYX_ALLFATHER_PASSWORD: ${{ secrets.ONYX_ALLFATHER_PASSWORD }}
        run: |
          set -euo pipefail
          npm run provision:allfather-password -- --environment production --approve-production __allfather__ --expect-database onyx-free-db
          echo "Provisioning command completed successfully. No credential or hash was printed."
