name: Provision All-Father Password

on:
  workflow_dispatch:
    inputs:
      production_approval:
        description: 'Type exactly: PROVISION __allfather__'
        required: true
        type: choice
        options:
          - 'DO NOT PROVISION'
          - 'PROVISION __allfather__'

permissions:
  contents: read

concurrency:
  group: onyx-allfather-production-provisioning
  cancel-in-progress: false

jobs:
  provision:
    if: ${{ inputs.production_approval == 'PROVISION __allfather__' }}
    name: Provision canonical All-Father password
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/cloudflare/edge-gateway
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/cloudflare/edge-gateway/package-lock.json

      - name: Validate required secret configuration
        shell: bash
        env:
          ONYX_ALLFATHER_PASSWORD: ${{ secrets.ONYX_ALLFATHER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID Actions secret"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN Actions secret"; exit 1; }
          test -n "${ONYX_ALLFATHER_PASSWORD}" || { echo "::error::Missing ONYX_ALLFATHER_PASSWORD Actions secret"; exit 1; }
          echo "Required secret configuration is present; secret values are not displayed."

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare identity
        run: npx wrangler whoami

      - name: Provision existing canonical principal
        shell: bash
        env:
          ONYX_ALLFATHER_PASSWORD: ${{ secrets.ONYX_ALLFATHER_PASSWORD }}
        run: |
          set -euo pipefail
          npm run provision:allfather-password -- --environment production --approve-production __allfather__ --expect-database onyx-free-db
          echo "Provisioning command completed successfully. No credential or hash was printed."
