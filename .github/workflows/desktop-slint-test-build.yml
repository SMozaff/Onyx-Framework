# TEST BUILD / NOT FOR PRODUCTION.
# Builds installable Debian 13 x86_64 packages of both Slint hosts (Staff: desktop-slint,
# Admin: admin-slint) and verifies install, launch, exit and uninstall in a clean Debian 13 container.
# Manual only. Publishes an Actions artifact, never a GitHub release.
name: Slint TEST BUILD (Debian 13)

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "API origin compiled into the test build (https only)"
        required: true
        default: "https://onyx-framework.soheil-mozaffari.workers.dev"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.product }} test package (Debian 13 x86_64)
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: staff
            crate: desktop-slint
            pkg: onyx-desktop-slint-test
            display: "ONYX Desktop Slint (TEST BUILD)"
          - product: admin
            crate: admin-slint
            pkg: onyx-admin-slint-test
            display: "ONYX Admin Slint (TEST BUILD)"
    env:
      API_ORIGIN: ${{ inputs.api_origin }}
    steps:
      - name: Validate API origin
        run: |
          set -euo pipefail
          if [[ ! "$API_ORIGIN" =~ ^https://[a-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::api_origin must be an https origin without a path."
            exit 1
          fi
          echo "Test build API origin: $API_ORIGIN"

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git build-essential pkg-config dpkg-dev \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.97.1"

      - name: Build release binary (test label and API origin)
        env:
          ONYX_TEST_BUILD_LABEL: "TEST BUILD / NOT FOR PRODUCTION"
          ONYX_API_ORIGIN: ${{ env.API_ORIGIN }}
        run: cargo build -p ${{ matrix.crate }} --release --locked

      - name: Build test package
        id: pkg
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | sed -n 's/.*"name":"${{ matrix.crate }}","version":"\([^"]*\)".*/\1/p' | head -1)"
          version="${version:-0.0.0}~test+${GITHUB_SHA:0:12}"
          outdir="$RUNNER_TEMP/test-package"
          deb="$(scripts/build-desktop-slint-test-package.sh \
            "target/release/${{ matrix.crate }}" "$version" "$GITHUB_SHA" "$API_ORIGIN" "$outdir" \
            "${{ matrix.pkg }}" "${{ matrix.display }}")"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write checksums, build info and instructions
        env:
          DEB: ${{ steps.pkg.outputs.deb }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          dir="$(dirname "$DEB")"
          cd "$dir"
          sha256sum "$(basename "$DEB")" > SHA256SUMS
          cat > BUILD-INFO.txt <<INFO
          ${{ matrix.display }}: TEST BUILD / NOT FOR PRODUCTION
          Version: $VERSION
          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          API origin (compiled in): $API_ORIGIN
          Target: Debian 13 (trixie), amd64
          Toolchain: Rust 1.97.1
          INFO
          cat > INSTALL.md <<DOC
          # ${{ matrix.display }}: TEST BUILD / NOT FOR PRODUCTION

          Feasibility host only. Not a production release and not a replacement for the Tauri apps.

          ## Verify the download
              sha256sum -c SHA256SUMS

          ## Install (Debian 13, amd64)
              sudo apt install ./${{ matrix.pkg }}_*_amd64.deb

          ## Run
              ${{ matrix.pkg }}
          Or start "${{ matrix.display }}" from the application menu.

          ## Uninstall
              sudo apt remove ${{ matrix.pkg }}

          Uninstalling the package does not delete data in your home directory.
          DOC
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$DEB" SHA256SUMS BUILD-INFO.txt INSTALL.md "$GITHUB_WORKSPACE/out/"

      - name: Upload test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: onyx-${{ matrix.product }}-slint-TEST-BUILD-debian13-amd64-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  verify:
    name: ${{ matrix.product }} clean Debian 13 install, launch, exit, uninstall
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: staff
            crate: desktop-slint
            pkg: onyx-desktop-slint-test
            display: "ONYX Desktop Slint (TEST BUILD)"
          - product: admin
            crate: admin-slint
            pkg: onyx-admin-slint-test
            display: "ONYX Admin Slint (TEST BUILD)"
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: onyx-${{ matrix.product }}-slint-TEST-BUILD-debian13-amd64-${{ github.sha }}
          path: artifact

      - name: Install prerequisites for a headless display
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates xvfb xauth coreutils dbus-x11 gnome-keyring

      - name: Verify checksum
        working-directory: artifact
        run: sha256sum -c SHA256SUMS

      - name: Install package
        working-directory: artifact
        run: apt-get install -y -qq --no-install-recommends ./${{ matrix.pkg }}_*_amd64.deb

      - name: Launch and exit cleanly under a virtual display
        run: |
          set -euo pipefail
          # The app keeps running until stopped. SIGTERM after 15 s counts as a clean run.
          set +e
          # The app needs a Secret Service (D-Bus + keyring) at startup. Provide one, as CI does for tests.
          xvfb-run -a dbus-run-session -- sh -c 'eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets --daemonize)" && timeout -s TERM 15 ${{ matrix.pkg }}'
          rc=$?
          set -e
          echo "exit code: $rc"
          if [[ "$rc" != "124" && "$rc" != "143" ]]; then
            echo "::error::App did not stay running for 15 s and stop on SIGTERM (exit $rc)."
            exit 1
          fi

      - name: Uninstall and confirm removal
        run: |
          set -euo pipefail
          apt-get remove -y -qq ${{ matrix.pkg }}
          if dpkg -s ${{ matrix.pkg }} >/dev/null 2>&1; then
            echo "::error::Package still installed after remove."
            exit 1
          fi
          if command -v ${{ matrix.pkg }} >/dev/null; then
            echo "::error::Binary still on PATH after uninstall."
            exit 1
          fi
          echo "Uninstall verified."
