name: Cloudflare Worker CI

on:
  push:
    branches: [main, 'fix/**', 'migration/**']
    paths:
      - 'deploy/cloudflare/edge-gateway/**'
      - '.github/workflows/cloudflare-worker-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/cloudflare/edge-gateway/**'
      - '.github/workflows/cloudflare-worker-check.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  worker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/cloudflare/edge-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install Worker dependencies
        run: npm install
      - name: Validate Worker bundle
        run: npm run check
      - name: Run Worker authentication and migration tests
        run: npm test
      - name: Apply migrations to a disposable local D1
        run: |
          cat > wrangler.test.toml <<'EOF'
          name = "onyx-migration-test"
          main = "src/index.ts"
          compatibility_date = "2026-10-09"

          [[d1_databases]]
          binding = "DB"
          database_name = "onyx-free-db"
          database_id = "00000000-0000-0000-0000-000000000000"
          migrations_dir = "migrations"

          [[durable_objects.bindings]]
          name = "EVENTS_HUB"
          class_name = "EventHub"

          [[durable_objects.bindings]]
          name = "RELAY_HUB"
          class_name = "RelayHub"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["EventHub"]

          [[migrations]]
          tag = "v2"
          new_sqlite_classes = ["RelayHub"]
          EOF
          npx wrangler d1 migrations apply onyx-free-db --local --config wrangler.test.toml
          npx wrangler d1 execute onyx-free-db --local --config wrangler.test.toml --json --command "SELECT name FROM d1_migrations" | jq -e 'type == "array" and (.[0].results | length) >= 5'
      - name: Verify the mobile-access migration landed
        shell: bash
        run: |
          set -euo pipefail
          # `0005_admin_settings.sql` must be recorded, and the table plus index the
          # `/ready` schema contract requires must exist. A missing migration leaves
          # the deployed Worker permanently degraded (see SECURITY_REMEDIATION_02.md).
          applied="$(npx wrangler d1 execute onyx-free-db --local --config wrangler.test.toml --json \
            --command "SELECT name FROM d1_migrations ORDER BY name")"
          printf '%s' "$applied" | jq -e '[.[0].results[].name] | index("0005_admin_settings.sql") != null'
          columns="$(npx wrangler d1 execute onyx-free-db --local --config wrangler.test.toml --json \
            --command "SELECT name FROM pragma_table_info('mobile_access_settings')")"
          printf '%s' "$columns" | jq -e '[.[0].results[].name] | sort == ["allowed_classes","last_operation_id","organization_id","updated_at","updated_by","version"]'
          indexes="$(npx wrangler d1 execute onyx-free-db --local --config wrangler.test.toml --json \
            --command "SELECT name FROM pragma_index_list('mobile_access_settings')")"
          printf '%s' "$indexes" | jq -e '[.[0].results[].name] | index("idx_mobile_access_settings_updated_at") != null'

      - name: Verify real Worker RelayHub WebSocket connection
        shell: bash
        run: |
          set -euo pipefail
          ORG="11111111-2222-4333-8444-555555555555"
          USER="aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"
          npx wrangler d1 execute onyx-free-db --local --config wrangler.test.toml --command "INSERT INTO organizations (id,name,is_active,created_at,updated_at) VALUES ('$ORG','relay-integration-org',1,unixepoch(),unixepoch())"
          npx wrangler d1 execute onyx-free-db --local --config wrangler.test.toml --command "INSERT INTO users (id,username,email,organization_id,password_hash,is_admin,is_active,class,role,parent_user_id,created_at,updated_at) VALUES ('$USER','relay-test-staff','relay-test@example.test','$ORG','not-used-for-token-auth',0,1,'STAFF','STAFF',NULL,unixepoch(),unixepoch())"
          printf 'ONYX_JWT_SECRET=relay-test-secret\n' > .dev.vars
          npx wrangler dev --local --config wrangler.test.toml --port 8787 > /tmp/onyx-relay-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            rm -f .dev.vars
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8787/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/onyx-relay-worker.log
            echo "::error::Local Worker did not start for the relay WebSocket integration test."
            exit 1
          fi
          ONYX_JWT_SECRET=relay-test-secret node test/relay-websocket.integration.mjs
