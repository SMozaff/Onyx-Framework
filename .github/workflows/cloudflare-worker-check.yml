name: Cloudflare Worker CI

on:
  push:
    branches: [main, 'fix/**', 'migration/**']
    paths:
      - 'deploy/cloudflare/edge-gateway/**'
      - '.github/workflows/cloudflare-worker-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/cloudflare/edge-gateway/**'
      - '.github/workflows/cloudflare-worker-check.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  worker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/cloudflare/edge-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install Worker dependencies
        run: npm install
      - name: Validate Worker bundle
        run: npm run check
