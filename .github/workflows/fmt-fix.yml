name: Format Fix

# Temporary repair branch: normalize Rust formatting and refresh the vulnerable
# rustls lockfile entry, then commit only the generated changes.
on:
  push:
    branches: [fix/ci-format-rustls]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - name: Update vulnerable rustls dependency
        run: cargo update -p rustls --precise 0.23.46
      - name: Format
        run: cargo fmt --all
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add Cargo.lock crates
            git commit -m "fix(ci): format Rust workspace and update rustls"
            git push
          else
            echo "Nothing to update."
          fi
