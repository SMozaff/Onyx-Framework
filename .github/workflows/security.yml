name: Security

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'hardening/**' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rust-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.97.1"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec audit
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Advisory and source-policy audit
        run: cargo deny check advisories bans licenses sources

  frontend-audit:
    name: Frontend audit (${{ matrix.name }} )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web-ui, path: web-ui }
          - { name: mobile-pwa, path: mobile-pwa }
          - { name: desktop-shell-ui, path: crates/bins/desktop-shell/ui }
          - { name: admin-shell-ui, path: crates/bins/admin-shell/ui }
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - run: test -f package-lock.json
      - name: Verify Node/npm platform baseline
        run: |
          set -euo pipefail
          node_major="$(node -p 'process.versions.node.split(".")[0]')"
          npm_major="$(npm --version | cut -d. -f1)"
          test "$node_major" = "22" || { echo "::error::Frontend CI requires Node 22; found $(node --version)"; exit 1; }
          test "$npm_major" = "10" || { echo "::error::Frontend CI requires npm 10; found $(npm --version)"; exit 1; }
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  dependency-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce immutable GitHub Action references
        shell: bash
        run: |
          set -euo pipefail
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          violations=()
          while IFS= read -r line; do
            ref="$(printf '%s' "$line" | sed -E 's/.*@([^[:space:]]+).*/\1/' | sed 's/#.*//')"
            if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              violations+=("$line")
            fi
          done < <(rg -n '^\s*-\s*uses:' "${workflows[@]}")
          if ((${#violations[@]})); then
            printf '%s\n' "::error::GitHub Actions must use immutable 40-hex commit-SHA references:" "${violations[@]}"
            exit 1
          fi
          if rg -n '^\s*pull_request_target:' .github/workflows; then
            echo "::error::pull_request_target is prohibited by the repository supply-chain policy"
            exit 1
          fi
      - name: Verify dependency control-plane artifacts
        run: | actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify dependency control-plane artifacts
        run: |
          test -f docs/DEPENDENCY_POLICY.md
          test -f .deny.toml
          test -f .github/dependabot.yml
          test -f web-ui/package-lock.json
          test -f mobile-pwa/package-lock.json
          test -f crates/bins/desktop-shell/ui/package-lock.json
          test -f crates/bins/admin-shell/ui/package-lock.json

  container-security:
    name: Container security (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-server, dockerfile: deploy/docker/api-server.Dockerfile }
          - { name: worker, dockerfile: deploy/docker/worker.Dockerfile }
          - { name: sync-agent, dockerfile: deploy/docker/sync-agent.Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image for security scanning
        run: docker build --file ${{ matrix.dockerfile }} --tag onyx-security:${{ matrix.name }} .
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # pinned
        with:
          image-ref: onyx-security:${{ matrix.name }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
        env:
          TRIVY_IGNOREFILE: ${{ github.workspace }}/.trivyignore

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: onyx-sbom-${{ github.sha }}
