name: Sqlx Prepare Fix

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx
          POSTGRES_DB: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://onyx:onyx@127.0.0.1:5432/onyx
      ONYX_DATABASE_KIND: postgres
      ONYX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - name: Install desktop-shell native dependencies (Tauri/GTK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-build
      - name: Run database migrations
        run: cargo run --package migration-tool -- up
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: Regenerate offline query metadata
        run: cargo sqlx prepare --workspace -- --all-targets
      - name: Report drift against committed metadata
        run: |
          git --no-pager diff --stat -- .sqlx || true
          git --no-pager diff -- .sqlx || true
      - name: Commit regenerated metadata
        run: |
          if git diff --quiet -- .sqlx; then
            echo "no drift detected; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .sqlx
          git commit -m "chore(sqlx): regenerate offline query metadata for sqlx-cli 0.9"
          git push origin HEAD:${{ github.ref_name }}