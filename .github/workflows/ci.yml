name: CI
# Node 24-compatible action baseline (GitHub removed Node 20 on 2026-09-23).

on:
  # Feature/fix branches are verified by pull_request, avoiding duplicate full runs.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Scope concurrency to an exact revision as well as its branch/PR ref.
# A cancelled earlier run can leave the aggregate merge-gate job queued while
# the next revision waits behind the same ref-only concurrency group. Including
# the SHA lets the exact new revision execute its full gate independently.
concurrency:
  group: onyx-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx
          POSTGRES_DB: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://onyx:onyx@127.0.0.1:5432/onyx
      ONYX_DATABASE_KIND: postgres
      ONYX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      # desktop-shell (Tauri) links against GTK/WebKit. Without this the
      # `cargo build --workspace` step below fails on a bare runner image
      # with "gdk-3.0 not found" — reproduced directly during the audit.
      - name: Install desktop-shell native dependencies (Tauri/GTK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Ensure rustfmt is installed
        run: rustup component add rustfmt
      # Shared key lets other Rust build jobs in this workflow reuse the
      # workspace release-build artifacts instead of recompiling from scratch.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "release-build"
      - name: Format
        run: cargo fmt --check
      # H5: read-only -- fails if Cargo.lock doesn't match Cargo.toml,
      # without writing anything. Every release.yml build job already has
      # this ahead of its own --locked build; ci.yml itself had no
      # equivalent gate at all, so a lockfile drifted out of sync with
      # Cargo.toml on a regular push/PR was never caught here, only (if
      # at all) at actual release time. Placed before Clippy/Build so a
      # stale lockfile is reported as exactly that, not as a confusing
      # downstream compile error. Deliberately NOT `--no-deps`: tested
      # directly (deliberately pinning a workspace dependency to a version
      # the committed lockfile can't satisfy) and confirmed `--no-deps`
      # makes this check pass regardless of drift, because it skips full
      # dependency resolution entirely -- there's nothing left for
      # --locked to check against. Without it, the same test genuinely
      # fails.
      - name: Verify locked dependency graph
        run: cargo metadata --locked
      - name: Verify ONYX_ENV access is centralized
        run: |
          set -euo pipefail
          forbidden=$(grep -RInE --include='*.rs' --exclude='config.rs' 'std::env::var\\("ONYX_ENV"\\)|env::var\\("ONYX_ENV"\\)' crates/bins/api-server/src || true)
          if [[ -n "$forbidden" ]]; then
            echo "::error::ONYX_ENV must be parsed only by crates/bins/api-server/src/config.rs"
            echo "$forbidden"
            exit 1
          fi
          forbidden_production=$(grep -RInE --include='*.rs' --exclude='config.rs' '(==|!=)[[:space:]]*"production"' crates/bins/api-server/src || true)
          if [[ -n "$forbidden_production" ]]; then
            echo "::error::production posture checks must be centralized in AppConfig"
            echo "$forbidden_production"
            exit 1
          fi
      - name: Clippy
        # Compile the explicit test-only fault-injection feature as part of the
        # verification surface, while the release build below remains default-feature
        # only and therefore excludes client-driven fault injection.
        run: cargo clippy --workspace --all-targets --features api-server/test-endpoints -- -D warnings
      - name: Build
        run: cargo build --workspace --release
      # Integration tests connect directly to PostgreSQL and expect the
      # schema to exist. Apply migrations before the test suite.
      - name: Run database migrations
        run: cargo run --package migration-tool -- up
      # H5: this repo carries committed .sqlx/ offline query metadata
      # (SQLX_OFFLINE=true above) so sqlx macros compile without a live
      # database. If a query changes but .sqlx/ isn't regenerated, the
      # build still succeeds against the stale cached metadata -- this is
      # the only thing that catches that drift. Needs sqlx-cli (not a
      # built-in cargo subcommand) and, unlike the workspace build itself,
      # a real schema to check queries against -- placed after migrations
      # run above, not before.
      # Pinned to the workspace's own sqlx version: `sqlx prepare` writes
      # a per-column `origin` field that older releases don't emit, so an
      # unpinned install silently invalidates every committed `.sqlx` file
      # the day sqlx-cli releases a new one. Track the workspace major.minor
      # here and regenerate `.sqlx` when it moves.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked
      - name: Verify sqlx offline metadata is current
        run: cargo sqlx prepare --check --workspace -- --all-targets
      # desktop-shell's secure_storage tests exercise the real `keyring`
      # crate against a live Secret Service, deliberately not mocked (see
      # keyring_adapter.rs's own test doc comments). A bare ubuntu-latest
      # runner has no D-Bus session bus or Secret Service daemon at all,
      # so those tests fail with "No default store has been set" — not a
      # code defect, a missing environment dependency. gnome-keyring is
      # the standard fix CI pipelines use for the `keyring` crate itself.
      - name: Start a D-Bus session and unlocked gnome-keyring (for secure_storage tests)
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11
          rm -f "$HOME/.local/share/keyrings/login.keyring"
          mkdir -p "$HOME/.local/share/keyrings"
          echo -n "" | gnome-keyring-daemon --unlock --login >/dev/null 2>&1 || true
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --components=secrets --daemonize)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Test
        # The API integration/E2E tests intentionally exercise the deterministic
        # 429/500 fault-injection contract. It is enabled only for this test invocation;
        # production/default release builds above do not enable it.
        run: cargo test --workspace --release --features api-server/test-endpoints -- --test-threads=1

  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify catalogs, schema, parity, interpolation, ordering, pluralization, terminology, unresolved keys, and determinism
        run: node scripts/sync-i18n.mjs --check
      - name: Audit user-facing literals in enforced surfaces
        run: node scripts/sync-i18n.mjs --check --audit-scope=web-ui/src/pages/Dashboard
      - name: Unit-test the canonical formatting and pluralization API
        run: node --test scripts/verify/verify-i18n-runtime.mjs
      - name: Phase 3 baseline audit and JSON report
        run: |
          mkdir -p artifacts/i18n
          node scripts/verify/i18n-ci.mjs --report=artifacts/i18n/report.json
      - name: Upload Phase 3 i18n report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: onyx-i18n-phase3-report-${{ github.sha }}
          path: artifacts/i18n/report.json
          if-no-files-found: warn
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit and integration tests
        run: npm test
      - name: Accessibility component tests
        run: npm run test:a11y
      - name: Feature contract audit
        run: npm run feature-audit

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Browser accessibility, keyboard, state, and visual regressions
        run: npm run test:browser
      - name: Production build and bundle budget
        run: npm run build
      - name: Upload web quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: onyx-web-quality-${{ github.sha }}
          path: |
            web-ui/test-reports/
            web-ui/playwright-report/
            web-ui/test-results/
          if-no-files-found: warn
          retention-days: 14

  # Phase 3: bring the observer PWA into CI before surface migration.
  mobile-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-pwa/package-lock.json
      - name: Install dependencies
        working-directory: mobile-pwa
        run: npm ci
      - name: Lint
        working-directory: mobile-pwa
        run: npm run lint
      - name: Type check
        working-directory: mobile-pwa
        run: npm run type-check
      - name: Unit/component/accessibility tests
        working-directory: mobile-pwa
        run: npm test && npm run test:a11y
      - name: Production build
        working-directory: mobile-pwa
        run: npm run build
      - name: Browser tests
        working-directory: mobile-pwa
        run: npx playwright install --with-deps chromium && npm run test:browser

  native-ui-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            crates/bins/desktop-shell/ui/package-lock.json
            crates/bins/admin-shell/ui/package-lock.json
      - name: Install Staff UI dependencies
        working-directory: crates/bins/desktop-shell/ui
        run: npm ci
      - name: Build Staff UI frontend smoke target
        working-directory: crates/bins/desktop-shell/ui
        run: npm run build
      - name: Install Admin UI dependencies
        working-directory: crates/bins/admin-shell/ui
        run: npm ci
      # The Admin shell owns ONYX credential sign-in. Its credential-form
      # and session handling are demo-critical and must be regression-tested.
      - name: Run Admin UI authentication tests
        working-directory: crates/bins/admin-shell/ui
        run: npm test
      - name: Build Admin UI frontend smoke target
        working-directory: crates/bins/admin-shell/ui
        run: npm run build
      - name: Write native UI evidence manifest
        env:
          UI_EVIDENCE_STATUS: passed
          UI_EVIDENCE_COMMANDS: |
            npm ci && npm run build (crates/bins/desktop-shell/ui)
            npm ci && npm test && npm run build (crates/bins/admin-shell/ui)
        run: node scripts/collect-ui-evidence.mjs artifacts/ui-evidence/native-ui-frontend-smoke.json native-ui-frontend-smoke
      - name: Upload native UI smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: onyx-native-ui-evidence-${{ github.sha }}
          path: artifacts/ui-evidence/
          if-no-files-found: warn
          retention-days: 30

  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Regenerate fail-closed mobile and Team 8 source reports
        run: bash scripts/verify/verify_team8.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: onyx-source-reports-${{ github.sha }}
          path: |
            docs/MOBILE_V11_STATIC_REPORT.json
            docs/TEAM8_STATIC_REPORT.json
          if-no-files-found: error
          retention-days: 30

# Phase 0 merge-control gate.
  #
  # This job aggregates the demo's active code, UI, localization, and source
  # contract checks. Production infrastructure validation and load/performance
  # testing are intentionally not part of the demo merge gate. Rust/frontend
  # advisory checks run in the dedicated Security workflow.
  merge-gate:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - check
      - i18n
      - web
      - mobile-pwa
      - native-ui-evidence
      - source-contracts
    steps:
      - name: Report upstream gate results
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          I18N_RESULT: ${{ needs.i18n.result }}
          WEB_RESULT: ${{ needs.web.result }}
          MOBILE_PWA_RESULT: ${{ needs['mobile-pwa'].result }}
          NATIVE_UI_RESULT: ${{ needs['native-ui-evidence'].result }}
          SOURCE_CONTRACTS_RESULT: ${{ needs['source-contracts'].result }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "check=$CHECK_RESULT" \
            "i18n=$I18N_RESULT" \
            "web=$WEB_RESULT" \
            "mobile-pwa=$MOBILE_PWA_RESULT" \
            "native-ui-evidence=$NATIVE_UI_RESULT" \
            "source-contracts=$SOURCE_CONTRACTS_RESULT"
          for result in \
            "$CHECK_RESULT" \
            "$I18N_RESULT" \
            "$WEB_RESULT" \
            "$MOBILE_PWA_RESULT" \
            "$NATIVE_UI_RESULT" \
            "$SOURCE_CONTRACTS_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "::error::Merge gate blocked: required verification result was $result."
              exit 1
            fi
          done
          echo "Merge gate passed: all required verification jobs succeeded."
