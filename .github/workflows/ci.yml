name: CI

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx
          POSTGRES_DB: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://onyx:onyx@127.0.0.1:5432/onyx
      ONYX_DATABASE_KIND: postgres
      ONYX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      # desktop-shell (Tauri) links against GTK/WebKit. Without this the
      # `cargo build --workspace` step below fails on a bare runner image
      # with "gdk-3.0 not found" — reproduced directly during the audit.
      - name: Install desktop-shell native dependencies (Tauri/GTK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Ensure rustfmt is installed
        run: rustup component add rustfmt
      # shared-key lets load-smoke (needs: check, so it always runs after
      # this job's cache is saved) restore the exact same release
      # target/ this job just built, instead of recompiling from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-build"
      - name: Format
        run: cargo fmt --check
      # H5: read-only -- fails if Cargo.lock doesn't match Cargo.toml,
      # without writing anything. Every release.yml build job already has
      # this ahead of its own --locked build; ci.yml itself had no
      # equivalent gate at all, so a lockfile drifted out of sync with
      # Cargo.toml on a regular push/PR was never caught here, only (if
      # at all) at actual release time. Placed before Clippy/Build so a
      # stale lockfile is reported as exactly that, not as a confusing
      # downstream compile error. Deliberately NOT `--no-deps`: tested
      # directly (deliberately pinning a workspace dependency to a version
      # the committed lockfile can't satisfy) and confirmed `--no-deps`
      # makes this check pass regardless of drift, because it skips full
      # dependency resolution entirely -- there's nothing left for
      # --locked to check against. Without it, the same test genuinely
      # fails.
      - name: Verify locked dependency graph
        run: cargo metadata --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --release
      # Several integration test suites (e.g.
      # persistence-postgres/tests/concurrency_test.rs) connect straight
      # to the `postgres` service and operate on `aggregates` et al.,
      # assuming the schema already exists — they don't run migrations
      # themselves, the same way an app process wouldn't. The only place
      # migrations were previously applied was the later "Migration
      # idempotency and rollback" step, which runs after Test, so the
      # service container started every prior run with no schema at all.
      - name: Run database migrations
        run: cargo run --package migration-tool -- up
      # H5: this repo carries committed .sqlx/ offline query metadata
      # (SQLX_OFFLINE=true above) so sqlx macros compile without a live
      # database. If a query changes but .sqlx/ isn't regenerated, the
      # build still succeeds against the stale cached metadata -- this is
      # the only thing that catches that drift. Needs sqlx-cli (not a
      # built-in cargo subcommand) and, unlike the workspace build itself,
      # a real schema to check queries against -- placed after migrations
      # run above, not before.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: Verify sqlx offline metadata is current
        run: cargo sqlx prepare --check --workspace -- --all-targets
      # desktop-shell's secure_storage tests exercise the real `keyring`
      # crate against a live Secret Service, deliberately not mocked (see
      # keyring_adapter.rs's own test doc comments). A bare ubuntu-latest
      # runner has no D-Bus session bus or Secret Service daemon at all,
      # so those tests fail with "No default store has been set" — not a
      # code defect, a missing environment dependency. gnome-keyring is
      # the standard fix CI pipelines use for the `keyring` crate itself.
      - name: Start a D-Bus session and unlocked gnome-keyring (for secure_storage tests)
        run: |
          sudo apt-get install -y gnome-keyring dbus-x11
          rm -f "$HOME/.local/share/keyrings/login.keyring"
          mkdir -p "$HOME/.local/share/keyrings"
          echo -n "" | gnome-keyring-daemon --unlock --login >/dev/null 2>&1 || true
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --components=secrets --daemonize)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace --release -- --test-threads=1
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Migration idempotency and rollback
        run: |
          cargo run --package migration-tool -- up
          cargo run --package migration-tool -- up
          cargo run --package migration-tool -- status
          cargo run --package migration-tool -- down --target 0
          cargo run --package migration-tool -- up
      - name: Contract verification
        run: bash scripts/verify/verify_team7.sh && bash scripts/verify/verify_team8.sh

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3
      - name: Helm lint
        run: |
          helm lint deploy/helm/onyx-api
          helm lint deploy/helm/onyx-worker
          helm lint deploy/helm/onyx-sync-agent
          helm lint deploy/helm/onyx-api-relay
      - name: Verify the relay chart genuinely renders single-replica (H3)
        # Real proof, not a review of the YAML source: renders the chart
        # exactly as `helm install` would and asserts the actual output.
        # Also proves an attempt to override the replica count from the
        # CLI (the normal way a values.yaml default gets overridden in
        # this repo's other charts) has no effect, since replicaCount is
        # deliberately not exposed as a value at all -- see
        # onyx-api-relay/templates/deployment.yaml's own comment.
        run: |
          set -euo pipefail
          rendered=$(helm template relay-check deploy/helm/onyx-api-relay --set replicaCount=5)
          echo "$rendered" | grep -E '^\s*replicas: 1$'
          if echo "$rendered" | grep -qE '^\s*replicas: 5$'; then
            echo "::error::onyx-api-relay rendered replicas: 5 -- replicaCount must not be settable for this chart"
            exit 1
          fi
          if [ "$(echo "$rendered" | grep -c '^kind: Deployment$')" -ne 1 ]; then
            echo "::error::expected exactly one Deployment in the rendered onyx-api-relay chart"
            exit 1
          fi
          if echo "$rendered" | grep -qi 'HorizontalPodAutoscaler'; then
            echo "::error::onyx-api-relay must not define an HPA -- it is deliberately not autoscaled"
            exit 1
          fi
          # Confirms the ordinary, horizontally-scaled onyx-api Rollout is
          # unaffected by the relay chart's existence -- its own HPA still
          # renders with its own real min/max, independent of the relay
          # chart's fixed single replica.
          api_rendered=$(helm template api-check deploy/helm/onyx-api -f deploy/helm/onyx-api/values-production.yaml)
          echo "$api_rendered" | grep -q 'kind: HorizontalPodAutoscaler'
          echo "$api_rendered" | grep -E '^\s*minReplicas: 5$'
          echo "$api_rendered" | grep -E '^\s*maxReplicas: 30$'
      - name: Terraform validate
        run: |
          terraform -chdir=deploy/terraform init -backend=false
          terraform -chdir=deploy/terraform validate
      - name: Docker build
        run: |
          docker build -f deploy/docker/api-server.Dockerfile .
          docker build -f deploy/docker/worker.Dockerfile .
          docker build -f deploy/docker/sync-agent.Dockerfile .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit and integration tests
        run: npm test
      - name: Accessibility component tests
        run: npm run test:a11y
      - name: Feature contract audit
        run: npm run feature-audit
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Browser accessibility, keyboard, state, and visual regressions
        run: npm run test:browser
      - name: Production build and bundle budget
        run: npm run build
      - name: Upload web quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-web-quality-${{ github.sha }}
          path: |
            web-ui/test-reports/
            web-ui/playwright-report/
            web-ui/test-results/
          if-no-files-found: warn
          retention-days: 14

  native-ui-evidence:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            crates/bins/desktop-shell/ui/package-lock.json
            crates/bins/admin-shell/ui/package-lock.json
      - name: Install Staff UI dependencies
        working-directory: crates/bins/desktop-shell/ui
        run: npm ci
      - name: Build Staff UI frontend smoke target
        working-directory: crates/bins/desktop-shell/ui
        run: npm run build
      - name: Install Admin UI dependencies
        working-directory: crates/bins/admin-shell/ui
        run: npm ci
      - name: Build Admin UI frontend smoke target
        working-directory: crates/bins/admin-shell/ui
        run: npm run build
      - name: Write native UI evidence manifest
        env:
          UI_EVIDENCE_STATUS: passed
          UI_EVIDENCE_COMMANDS: |
            npm ci && npm run build (crates/bins/desktop-shell/ui)
            npm ci && npm run build (crates/bins/admin-shell/ui)
        run: node scripts/collect-ui-evidence.mjs artifacts/ui-evidence/native-ui-frontend-smoke.json native-ui-frontend-smoke
      - name: Upload native UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-native-ui-evidence-${{ github.sha }}
          path: artifacts/ui-evidence/
          if-no-files-found: warn
          retention-days: 30

  load-smoke:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx
          POSTGRES_DB: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      # Same shared-key as check's rust-cache step: this job runs after
      # check (needs: check) in the same workflow run, so it restores the
      # dependency artifacts check's own release build already compiled,
      # rather than compiling the whole workspace's dependency tree from
      # scratch. Confirmed necessary by the first-ever load-smoke run
      # (33176531805): it timed out with `rustc` still mid-compile when
      # this job had no cache at all and built api-server cold.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-build"
      - uses: grafana/setup-k6-action@v1
      # A prior version ran `cargo run --release` directly in the
      # health-check loop below, so compilation and startup were both
      # counted against the same 60s window -- a cold compile alone could
      # (and did) exceed it before the server ever bound the port. Building
      # first, as its own step with the job's full remaining time budget,
      # means the health-check loop afterward is actually measuring server
      # startup, not compilation.
      - name: Build API release binary
        run: cargo build --release --package api-server
      - name: Start optimized API
        env:
          ONYX_ENV: test
          ONYX_TEST_MODE: "1"
          ONYX_COMMAND_RATE_LIMIT: "1000000"
          ONYX_BIND: 127.0.0.1:3000
          DATABASE_URL: sqlite://load-test.db?mode=rwc
        run: |
          ./target/release/api-server >api.log 2>&1 &
          echo $! > api.pid
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/health && break; sleep 1; done
      - run: k6 run tests/load/smoke-test.js --vus 100 --duration 60s
      - if: always()
        run: kill "$(cat api.pid)" || true

  mobile-freeze-guard:
    # M0 (DECISIONS.md H10.M0 / ONYX-MOB-00 §8): mobile/lib/ is a Frozen
    # Reference Implementation while the Kotlin Android rewrite is
    # underway. Fails if this diff touches mobile/lib/ without also
    # touching mobile/FROZEN_EXCEPTION.md to justify a real security fix
    # or critical defect -- see scripts/verify/verify_mobile_freeze.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main --depth=1000
      - run: bash scripts/verify/verify_mobile_freeze.sh origin/main

  mobile-dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Complete Flutter-owned platform scaffold
        run: bash tool/ensure_platform_scaffold.sh
      # H6: install from the committed pubspec.lock only. `flutter pub
      # upgrade` used to run right after this, silently bumping every
      # dependency to its latest allowed version before validating
      # anything -- a green run proved the *upgraded* tree passed, not
      # the tree actually checked in. `dart fix --apply || true` used to
      # run after that: it mutates source in place, and the `|| true`
      # additionally swallowed any failure from the fix step itself, so
      # CI never even reported whether it succeeded. Neither mutation is
      # needed for real validation -- `flutter analyze` below is the
      # actual check, confirmed independently this same session: an
      # earlier `auth.dart` syntax error was caught by `flutter analyze`
      # directly, not by an auto-fix step.
      - run: flutter pub get
      # H6: fatal by default (no --no-fatal-warnings). Checked the real,
      # current warning count first rather than assuming: `flutter
      # analyze` reports zero issues against this tree today, so there is
      # no backlog to clear or defer -- turning warnings fatal here
      # cannot turn CI red for anything unrelated to a given change.
      - name: Analyze
        run: flutter analyze
      - run: flutter test
      - name: Mobile structural contract
        working-directory: .
        run: bash scripts/verify/verify_mobile.sh

  mobile-android:
    runs-on: ubuntu-latest
    needs: mobile-dart
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash mobile/tool/ensure_platform_scaffold.sh
      - run: bash mobile/tool/build_rust_android.sh
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: onyx-mobile-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  mobile-ios:
    runs-on: macos-latest
    needs: mobile-dart
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash mobile/tool/ensure_platform_scaffold.sh
      - run: bash mobile/tool/build_rust_ios.sh
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile/ios
        run: pod install
      - working-directory: mobile
        run: flutter build ios --simulator
      - uses: actions/upload-artifact@v4
        with:
          name: onyx-mobile-ios-simulator-debug
          path: mobile/build/ios/iphonesimulator/*.app

  # A1 (ONYX-MOB-01 §25): the native Kotlin Android rewrite, distinct
  # from the `mobile-android` job above (which builds the *frozen
  # Flutter* app's own Android APK via `flutter build apk`). This job
  # builds `mobile-android/`, the new, separate project.
  mobile-android-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build native libraries for every target ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash mobile-android/tool/build_rust_jni.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle assembleDebug
        working-directory: mobile-android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: onyx-mobile-android-kotlin-debug
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk