name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx
          POSTGRES_DB: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://onyx:onyx@127.0.0.1:5432/onyx
      ONYX_DATABASE_KIND: postgres
      ONYX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - name: Ensure rustfmt is installed
        run: rustup component add rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --release
      - name: Test
        run: cargo test --workspace --release -- --test-threads=1
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: Migration idempotency and rollback
        run: |
          cargo run --package migration-tool -- up
          cargo run --package migration-tool -- up
          cargo run --package migration-tool -- status
          cargo run --package migration-tool -- down --target 0
          cargo run --package migration-tool -- up
      - name: Contract verification
        run: bash scripts/verify/verify_team7.sh && bash scripts/verify/verify_team8.sh

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3
      - name: Helm lint
        run: |
          helm lint deploy/helm/onyx-api
          helm lint deploy/helm/onyx-worker
          helm lint deploy/helm/onyx-sync-agent
      - name: Terraform validate
        run: |
          terraform -chdir=deploy/terraform init -backend=false
          terraform -chdir=deploy/terraform validate
      - name: Docker build
        run: |
          docker build -f deploy/docker/api-server.Dockerfile .
          docker build -f deploy/docker/worker.Dockerfile .
          docker build -f deploy/docker/sync-agent.Dockerfile .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # Temporary patch: fix Vite config (move test block to vitest.config.ts)
      - name: Patch Vite config for Vitest
        run: |
          if grep -q '"test":' vite.config.ts; then
            cat > vitest.config.ts << 'EOF'
          import { defineConfig } from 'vitest/config';
          import react from '@vitejs/plugin-react';
          export default defineConfig({
            plugins: [react()],
            test: {
              globals: true,
              environment: 'jsdom',
              setupFiles: './src/test/setup.ts',
            },
          });
          EOF
            sed -i '/test:/,/^  \}/d' vite.config.ts
          fi
      - run: npm run type-check
      - run: npm test
      - run: npm run test:a11y
      - run: npm run feature-audit
      - run: npm run build
      - run: npm run bundle-check

  load-smoke:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx
          POSTGRES_DB: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: grafana/setup-k6-action@v1
      - name: Start API
        env:
          ONYX_ENV: test
          ONYX_TEST_MODE: "1"
          ONYX_COMMAND_RATE_LIMIT: "1000000"
          ONYX_BIND: 127.0.0.1:3000
          DATABASE_URL: sqlite://load-test.db?mode=rwc
          ONYX_GOVERNANCE_DATABASE_URL: postgres://onyx:onyx@127.0.0.1:5432/onyx
        run: |
          cargo run --package api-server >api.log 2>&1 &
          echo $! > api.pid
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/health && break; sleep 1; done
      - run: k6 run tests/load/smoke-test.js --vus 100 --duration 60s
      - if: always()
        run: kill "$(cat api.pid)" || true

  mobile-dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Complete Flutter-owned platform scaffold
        run: bash tool/ensure_platform_scaffold.sh
      - run: flutter pub get
      - run: flutter pub upgrade
      - name: Apply automatic fixes (dart fix)
        run: dart fix --apply || true
      - name: Analyze (allow warnings for now)
        run: flutter analyze --no-fatal-warnings
      - run: flutter test
      - name: Mobile structural contract
        working-directory: .
        run: bash scripts/verify/verify_mobile.sh

  mobile-android:
    runs-on: ubuntu-latest
    needs: mobile-dart
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash mobile/tool/ensure_platform_scaffold.sh
      - run: bash mobile/tool/build_rust_android.sh
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: onyx-mobile-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  mobile-ios:
    runs-on: macos-latest
    needs: mobile-dart
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash mobile/tool/ensure_platform_scaffold.sh
      - run: bash mobile/tool/build_rust_ios.sh
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile/ios
        run: pod install
      - working-directory: mobile
        run: flutter build ios --simulator