name: CI
# Node 24-compatible action baseline (GitHub removed Node 20 on 2026-09-23).

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

permissions:
  contents: read
  packages: read

jobs:
  # Temporary H-02 lockfile bootstrap. This job runs only on the
  # completion branch's push events, generates Cargo.lock from the exact
  # modernized manifest, commits it, and is removed before final merge.
  dependency-lock-resolution:
    if: ${{ github.head_ref == 'phase-2/h02-completion' || (github.event_name == 'push' && github.ref_name == 'phase-2/h02-completion') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - name: Resolve dependency graph
        run: cargo update
      - name: Commit generated Cargo.lock
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): regenerate Cargo.lock for H-02"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload lockfile evidence
        uses: actions/upload-artifact@v7
        with:
          name: h02-generated-cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 2
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: onyx
          POSTGRES_PASSWORD: onyx
          POSTGRES_DB: onyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onyx -d onyx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://onyx:onyx@127.0.0.1:5432/onyx
      ONYX_DATABASE_KIND: postgres
      ONYX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"