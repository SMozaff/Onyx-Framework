name: Desktop Slint and Relay Adapter

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/bins/desktop-slint/**"
      - "crates/bins/desktop-shell/src/lib.rs"
      - "crates/transports/relay-websocket-adapter/**"
      - ".github/workflows/desktop-slint.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/bins/desktop-slint/**"
      - "crates/bins/desktop-shell/src/lib.rs"
      - "crates/transports/relay-websocket-adapter/**"
      - ".github/workflows/desktop-slint.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - name: Install Linux libraries for Slint
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "desktop-slint-cross-platform"
      - name: Verify locked dependency graph
        run: cargo metadata --locked
      - name: Format
        run: cargo fmt -p desktop-slint -p relay-websocket-adapter -- --check
      - name: Clippy
        run: cargo clippy -p desktop-slint -p relay-websocket-adapter --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p desktop-slint -p relay-websocket-adapter
      - name: Check existing Tauri host against shared adapter
        run: cargo check -p desktop-shell
      - name: Release build
        run: cargo build -p desktop-slint --release
