name: ONYX Signed Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  actions: read
jobs:
  release-binaries:
    strategy:
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: macos-14, target: aarch64-apple-darwin}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.97.1", targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
      - name: Resolve frozen dependency graph
        run: cargo generate-lockfile
      - run: cargo build --locked --release --target ${{ matrix.target }} -p api-server -p worker -p migration-tool -p sync-agent
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/api-server* artifacts/ || true
          cp target/${{ matrix.target }}/release/worker* artifacts/ || true
          cp target/${{ matrix.target }}/release/migration-tool* artifacts/ || true
          cp target/${{ matrix.target }}/release/sync-agent* artifacts/ || true
          tar -czf "onyx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C artifacts .
      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: GPG-sign binary package
        shell: bash
        run: gpg --batch --yes --armor --detach-sign "onyx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            onyx-*.tar.gz
            onyx-*.tar.gz.asc

  # Builds and GPG-signs the native desktop app (Tauri) for all three
  # target platforms. Added because `release-binaries` above only ever
  # covered the server-side binaries (api-server/worker/migration-tool/
  # sync-agent) -- desktop-shell was compiled by ci.yml's `check` job
  # for Linux only, as a plain `cargo build` correctness check, never
  # bundled into an installable app on any platform. `tauri.conf.json`'s
  # own "targets": "all" already specifies every platform's native
  # bundle format; this job is what actually invokes the bundler.
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "deb,appimage"}
          - {os: macos-14, target: aarch64-apple-darwin, bundles: "dmg"}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, bundles: "msi,nsis"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.97.1", targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: "npm", cache-dependency-path: crates/bins/desktop-shell/ui/package-lock.json}
      # Tauri v2 on Linux links against WebKitGTK; matches ci.yml's own
      # `check` job install list exactly, since that job proved this is
      # the working set on a bare ubuntu-24.04 runner image.
      - name: Install desktop-shell native dependencies (Tauri/GTK)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Resolve frozen dependency graph
        run: cargo generate-lockfile
      - name: Install frontend dependencies
        working-directory: crates/bins/desktop-shell/ui
        run: npm ci
      - name: Import Apple signing certificate
        if: matrix.os == 'macos-14'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        # Ad-hoc-signs and skips notarization if these secrets are unset,
        # matching Tauri's own documented fallback (see this job's header
        # comment) -- a signed build is not yet configured for this repo
        # and should not silently block every other platform's release.
        continue-on-error: true
      - name: Build and bundle the desktop app
        # Deliberately omits tagName/releaseName/releaseId: per
        # tauri-action's own documented behavior, providing none of
        # those three makes it build only, with no GitHub release
        # interaction -- this repo already has its own `publish` job
        # assembling every platform's artifacts into one release via
        # softprops/action-gh-release, and letting tauri-action also
        # try to create/upload to a release would conflict with it.
        #
        # This is a Cargo workspace, so `cargo`/`tauri build`'s output
        # lands in the *workspace root's* `target/`, not a per-crate
        # one -- confirmed by checking how every other job in this file
        # (`release-binaries`) already references
        # `target/${{ matrix.target }}/release/...` from the repo root.
        # The "Locate bundle output" step below relies on that same
        # workspace-root path.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/bins/desktop-shell
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          # The CLI is declared in ui/package.json rather than at the
          # desktop-shell root. `--prefix ui` therefore resolves the
          # locked local executable while the action still runs with
          # desktop-shell as the Tauri project directory.
          tauriScript: npx --prefix ui tauri
      - name: Locate bundle output
        shell: bash
        run: |
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          echo "Bundle contents:"
          find "$bundle_dir" -maxdepth 2 -type f
          mkdir -p artifacts
          find "$bundle_dir" -maxdepth 2 -type f \
            \( -iname "*.deb" -o -iname "*.AppImage" -o -iname "*.dmg" \
               -o -iname "*.msi" -o -iname "*.exe" \) \
            -exec cp {} artifacts/ \;
      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: GPG-sign desktop bundles
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          for f in *; do
            gpg --batch --yes --armor --detach-sign "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/*

  release-images:
    runs-on: ubuntu-24.04
    strategy:
      matrix: {service: [api-server, worker, sync-agent, migration-tool]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}:${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Cosign image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SPDX 2.3 JSON SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          "${{ steps.syft.outputs.cmd }}" "$IMAGE" -o "spdx-json@2.3=onyx-${{ matrix.service }}.spdx.json"
          test "$(jq -r .spdxVersion onyx-${{ matrix.service }}.spdx.json)" = "SPDX-2.3"
      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: onyx-${{ matrix.service }}.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: onyx-${{ matrix.service }}.spdx.json

  publish:
    runs-on: ubuntu-24.04
    needs: [release-binaries, release-desktop, release-images]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: release-assets, merge-multiple: true}
      - uses: actions/attest@v4
        with: {subject-path: "release-assets/**"}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
