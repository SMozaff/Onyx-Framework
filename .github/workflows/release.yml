name: ONYX Signed Release
on:
  push:
    tags: ["v*"]
  # Manual runs are for grabbing debug build artifacts on demand --
  # not a release. release-images (GHCR push + SBOM/provenance
  # attestation + cosign signing) and publish (creates a real GitHub
  # Release) are both gated to the tag trigger only, further down.
  # workflow_dispatch has no ref_name of its own; github.ref_name on a
  # manual run resolves to the branch name ("main"), which would
  # otherwise silently produce artifacts/images misleadingly named
  # after the branch instead of a version -- moot here since those two
  # jobs never run on a manual trigger, but noted for anyone tempted
  # to widen this later.
  workflow_dispatch: {}
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  actions: read
jobs:
  # Windows-only: the real production server is a Windows 10 machine in
  # the office (see DECISIONS.md) -- there is no current deployment
  # target for Linux/macOS server binaries. Previously built all three
  # OSes; narrowed here since the other two platforms' outputs were
  # never actually deployed anywhere. release-images below is a
  # separate, Linux-container artifact (GHCR/Docker) for a different
  # deployment path and is deliberately untouched by this narrowing --
  # it was never OS-matrixed in the first place (one ubuntu-24.04
  # runner builds every service's Linux container image, regardless of
  # native server-binary platform support).
  release-binaries:
    strategy:
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.97.1", targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps
      - run: cargo build --locked --release --target ${{ matrix.target }} -p api-server -p worker -p migration-tool -p sync-agent
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/api-server* artifacts/ || true
          cp target/${{ matrix.target }}/release/worker* artifacts/ || true
          cp target/${{ matrix.target }}/release/migration-tool* artifacts/ || true
          cp target/${{ matrix.target }}/release/sync-agent* artifacts/ || true
          tar -czf "onyx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C artifacts .
      # Signing (and its matching .asc upload) is gated to real tag
      # releases only. workflow_dispatch runs are for grabbing debug
      # artifacts on demand; github.ref_name on a manual run is the
      # branch name ("main"), not a version, and there's no reason
      # to spend a real GPG signature on a debug build nobody is
      # meant to redistribute as a release asset.
      - name: Import GPG signing key
        if: github.event_name == 'push'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: GPG-sign binary package
        if: github.event_name == 'push'
        shell: bash
        run: gpg --batch --yes --armor --detach-sign "onyx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            onyx-*.tar.gz
            onyx-*.tar.gz.asc
          if-no-files-found: ignore

  # Builds and GPG-signs the native desktop app (Tauri) for all three
  # target platforms. Added because `release-binaries` above only ever
  # covered the server-side binaries (api-server/worker/migration-tool/
  # sync-agent) -- desktop-shell was compiled by ci.yml's `check` job
  # for Linux only, as a plain `cargo build` correctness check, never
  # bundled into an installable app on any platform. `tauri.conf.json`'s
  # own "targets": "all" already specifies every platform's native
  # bundle format; this job is what actually invokes the bundler.
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "deb,appimage"}
          - {os: macos-14, target: aarch64-apple-darwin, bundles: "dmg"}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, bundles: "msi,nsis"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.97.1", targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: "npm", cache-dependency-path: crates/bins/desktop-shell/ui/package-lock.json}
      # Tauri v2 on Linux links against WebKitGTK; matches ci.yml's own
      # `check` job install list exactly, since that job proved this is
      # the working set on a bare ubuntu-24.04 runner image.
      - name: Install desktop-shell native dependencies (Tauri/GTK)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps
      - name: Install frontend dependencies
        working-directory: crates/bins/desktop-shell/ui
        run: npm ci
      - name: Import Apple signing certificate
        if: matrix.os == 'macos-14'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        # Ad-hoc-signs and skips notarization if these secrets are unset,
        # matching Tauri's own documented fallback (see this job's header
        # comment) -- a signed build is not yet configured for this repo
        # and should not silently block every other platform's release.
        continue-on-error: true
      - name: Build and bundle the desktop app
        # Deliberately omits tagName/releaseName/releaseId: per
        # tauri-action's own documented behavior, providing none of
        # those three makes it build only, with no GitHub release
        # interaction -- this repo already has its own `publish` job
        # assembling every platform's artifacts into one release via
        # softprops/action-gh-release, and letting tauri-action also
        # try to create/upload to a release would conflict with it.
        #
        # This is a Cargo workspace, so `cargo`/`tauri build`'s output
        # lands in the *workspace root's* `target/`, not a per-crate
        # one -- confirmed by checking how every other job in this file
        # (`release-binaries`) already references
        # `target/${{ matrix.target }}/release/...` from the repo root.
        # The "Locate bundle output" step below relies on that same
        # workspace-root path.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `${{ secrets.X }}` evaluates to an empty string, not unset,
          # when the secret doesn't exist -- confirmed via a real
          # release.yml run: this explicit-but-empty value made Tauri's
          # macOS bundler codesign with identity "" ("The specified item
          # could not be found in the keychain"), not the ad-hoc "-"
          # fallback this job's own header comment already documents as
          # the intended no-real-cert behavior. `|| '-'` restores that
          # documented fallback only when the secret is genuinely unset;
          # a real configured identity still wins.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/bins/desktop-shell
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          # tauri-action@v0 prepends `npm run` to npm-based scripts. Execute
          # the UI-local CLI entry point through Node instead so the same
          # command works on Windows, macOS, and Linux without shell shims.
          tauriScript: node ${{ github.workspace }}/crates/bins/desktop-shell/ui/node_modules/@tauri-apps/cli/tauri.js
      - name: Locate bundle output
        shell: bash
        run: |
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          echo "Bundle contents:"
          find "$bundle_dir" -maxdepth 2 -type f
          mkdir -p artifacts
          find "$bundle_dir" -maxdepth 2 -type f \
            \( -iname "*.deb" -o -iname "*.AppImage" -o -iname "*.dmg" \
               -o -iname "*.msi" -o -iname "*.exe" \) \
            -exec cp {} artifacts/ \;
          shopt -s nullglob
          bundles=(artifacts/*)
          if (( ${#bundles[@]} == 0 )); then
            echo "No supported desktop bundle was produced for ${{ matrix.target }}" >&2
            exit 1
          fi
          printf 'Collected %s desktop bundle(s) for %s\n' "${#bundles[@]}" "${{ matrix.target }}"
      # Same manual-run signing exemption as release-binaries above.
      - name: Import GPG signing key
        if: github.event_name == 'push'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: GPG-sign desktop bundles
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          for f in *; do
            gpg --batch --yes --armor --detach-sign "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/*

  # Admin Platform is a distinct Tauri shell with its own frontend and
  # product/identifier metadata. It intentionally has its own explicit job
  # rather than a single parameterized desktop matrix: the two package-lock
  # cache paths and future signing/release requirements remain independently
  # readable, while each continues to build the same three supported targets.
  release-admin-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: "deb,appimage"}
          - {os: macos-14, target: aarch64-apple-darwin, bundles: "dmg"}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, bundles: "msi,nsis"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.97.1", targets: "${{ matrix.target }}"}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: "npm", cache-dependency-path: crates/bins/admin-shell/ui/package-lock.json}
      # Tauri v2 on Linux links against WebKitGTK. This mirrors ci.yml and
      # release-desktop exactly instead of re-deriving a second dependency set.
      - name: Install admin-shell native dependencies (Tauri/GTK)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps
      - name: Install frontend dependencies
        working-directory: crates/bins/admin-shell/ui
        run: npm ci
      # No real signing credentials are configured yet. Preserve the Staff
      # app's documented ad-hoc macOS fallback rather than treating that as
      # successful production code-signing for either app.
      - name: Import Apple signing certificate
        if: matrix.os == 'macos-14'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        continue-on-error: true
      - name: Build and bundle the Admin desktop app
        # Omitting tagName/releaseName/releaseId makes tauri-action build only.
        # `publish` below remains the one release-assembly owner. Cargo output
        # is at workspace-root target/, not inside crates/bins/admin-shell.
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `${{ secrets.X }}` evaluates to an empty string, not unset,
          # when the secret doesn't exist -- confirmed via a real
          # release.yml run: this explicit-but-empty value made Tauri's
          # macOS bundler codesign with identity "" ("The specified item
          # could not be found in the keychain"), not the ad-hoc "-"
          # fallback this job's own header comment already documents as
          # the intended no-real-cert behavior. `|| '-'` restores that
          # documented fallback only when the secret is genuinely unset;
          # a real configured identity still wins.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/bins/admin-shell
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          # tauri-action@v0 prepends `npm run` to npm-based scripts. Execute
          # the UI-local CLI entry point through Node instead so the same
          # command works on Windows, macOS, and Linux without shell shims.
          tauriScript: node ${{ github.workspace }}/crates/bins/admin-shell/ui/node_modules/@tauri-apps/cli/tauri.js
      - name: Locate Admin bundle output
        shell: bash
        run: |
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          echo "Bundle contents:"
          find "$bundle_dir" -maxdepth 2 -type f
          mkdir -p artifacts
          find "$bundle_dir" -maxdepth 2 -type f \
            \( -iname "*.deb" -o -iname "*.AppImage" -o -iname "*.dmg" \
               -o -iname "*.msi" -o -iname "*.exe" \) \
            -exec cp {} artifacts/ \;
          shopt -s nullglob
          bundles=(artifacts/*)
          if (( ${#bundles[@]} == 0 )); then
            echo "No supported Admin desktop bundle was produced for ${{ matrix.target }}" >&2
            exit 1
          fi
          printf 'Collected %s Admin desktop bundle(s) for %s\n' "${#bundles[@]}" "${{ matrix.target }}"
      # Same manual-run signing exemption as the other two jobs above.
      - name: Import GPG signing key
        if: github.event_name == 'push'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: GPG-sign Admin desktop bundles
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          for f in *; do
            gpg --batch --yes --armor --detach-sign "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: admin-desktop-${{ matrix.target }}
          path: artifacts/*

  # Real container publish: pushes signed, attested images to GHCR.
  # Gated to tag pushes only -- a manual run has no version tag to
  # name an image after, and this project's manual-trigger use case is
  # "give me debug build artifacts," not "publish a release."
  release-images:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix: {service: [api-server, worker, sync-agent, migration-tool]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}:${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Cosign image digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SPDX 2.3 JSON SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}@${{ steps.build.outputs.digest }}
        run: |
          "${{ steps.syft.outputs.cmd }}" "$IMAGE" -o "spdx-json@2.3=onyx-${{ matrix.service }}.spdx.json"
          test "$(jq -r .spdxVersion onyx-${{ matrix.service }}.spdx.json)" = "SPDX-2.3"
      - name: Attest image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/onyx-${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: onyx-${{ matrix.service }}.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: onyx-${{ matrix.service }}.spdx.json

  # Real GitHub Release creation. Gated the same way as release-images
  # and for the same reason: manual runs are for grabbing build
  # artifacts, not for publishing a release. A skipped (not failed)
  # dependency still satisfies `needs` by default, so this needs its
  # own explicit `if` rather than relying on release-images' gate alone.
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [release-binaries, release-desktop, release-admin-desktop, release-images]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: release-assets, merge-multiple: true}
      - uses: actions/attest@v4
        with: {subject-path: "release-assets/**"}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**
