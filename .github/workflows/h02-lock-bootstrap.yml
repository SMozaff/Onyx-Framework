name: H-02 Lockfile Bootstrap
on:
  push:
    branches: [ "phase-2/h02-completion" ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - name: Generate canonical Cargo.lock
        run: cargo update
      - name: Commit canonical Cargo.lock
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the manifest"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): generate canonical Cargo.lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
