name: Prepare Rust CI fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-rust-format-security-audit
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Update vulnerable Rust dependencies
        run: cargo update -p rustls
      - name: Verify formatting and advisory gate
        run: |
          cargo fmt --all -- --check
          cargo install cargo-audit --locked
          cargo audit
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix: format Rust sources and update rustls"
          git push origin HEAD:fix/ci-rust-format-security-audit
