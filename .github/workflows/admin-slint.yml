name: Admin Slint UI

on:
  pull_request:
    paths:
      - "crates/bins/admin-slint/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/admin-slint.yml"
  push:
    branches: [main]
    paths:
      - "crates/bins/admin-slint/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/admin-slint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Install Linux libraries for Slint
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Format
        run: cargo fmt -p admin-slint -- --check
      - name: Clippy
        run: cargo clippy -p admin-slint --all-targets -- -D warnings
      - name: Test
        run: cargo test -p admin-slint
