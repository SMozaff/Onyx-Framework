name: All-Father ONYX credential smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare/edge-gateway/src/**'
      - '.github/workflows/allfather-auth-smoke.yml'

permissions:
  contents: read

jobs:
  allfather-auth:
    name: Verify All-Father ONYX credential login against deployed Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required Actions secrets
        shell: bash
        env:
          ONYX_ALLFATHER_USERNAME: ${{ secrets.ONYX_ALLFATHER_USERNAME }}
          ONYX_ALLFATHER_PASSWORD: ${{ secrets.ONYX_ALLFATHER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ONYX_ALLFATHER_USERNAME" || { echo "::error::Add ONYX_ALLFATHER_USERNAME in GitHub Actions secrets."; exit 1; }
          test -n "$ONYX_ALLFATHER_PASSWORD" || { echo "::error::Add ONYX_ALLFATHER_PASSWORD in GitHub Actions secrets."; exit 1; }

      - name: Authenticate directly with ONYX credentials
        shell: bash
        env:
          ONYX_ALLFATHER_USERNAME: ${{ secrets.ONYX_ALLFATHER_USERNAME }}
          ONYX_ALLFATHER_PASSWORD: ${{ secrets.ONYX_ALLFATHER_PASSWORD }}
          ONYX_WORKER_URL: https://onyx-framework.soheil-mozaffari.workers.dev
        run: |
          set -euo pipefail
          node <<'NODE'
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          const username = process.env.ONYX_ALLFATHER_USERNAME;
          const password = process.env.ONYX_ALLFATHER_PASSWORD;
          const workerUrl = process.env.ONYX_WORKER_URL;
          async function jsonRequest(url, options, label) {
            let response;
            try { response = await fetch(url, options); } catch { fail(`${label}: network request failed.`); }
            const body = await response.json().catch(() => ({}));
            if (!response.ok) fail(`${label}: HTTP ${response.status}; credentials and response body suppressed.`);
            return body;
          }
          (async () => {
            const session = await jsonRequest(`${workerUrl}/api/auth/login`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ username, password, client_type: 'admin' }),
            }, 'ONYX credential authentication');
            if (typeof session.access_token !== 'string' || typeof session.refresh_token !== 'string' ||
                session.user?.role !== 'ALL_FATHER' || session.user?.username !== 'allfather') {
              fail('ONYX did not issue the expected canonical All-Father session.');
            }
            const protectedResponse = await fetch(`${workerUrl}/api/users/hierarchy`, {
              headers: { authorization: `Bearer ${session.access_token}` },
            });
            if (!protectedResponse.ok) fail(`Authenticated protected API request failed with HTTP ${protectedResponse.status}.`);
            console.log('PASS: ONYX credentials authenticated; canonical All-Father session issued; protected API accepted it.');
          })().catch(() => fail('Authentication smoke test failed unexpectedly; credentials and tokens suppressed.'));
          NODE
