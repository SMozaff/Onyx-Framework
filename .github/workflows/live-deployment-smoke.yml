name: Live Cloudflare Smoke

on:
  push:
    branches:
      - migration/cloudflare-free-worker
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Cloudflare Worker health and readiness
        shell: bash
        run: |
          set -euo pipefail
          EDGE="https://onyx-framework.soheil-mozaffari.workers.dev"
          for i in {1..30}; do
            health="$(curl -fsS --max-time 10 "$EDGE/health" || true)"
            ready="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$EDGE/ready" || true)"
            if printf '%s' "$health" | jq -e '.status == "ok" and .runtime == "cloudflare-workers-free"' >/dev/null 2>&1 && [ "$ready" = "200" ]; then
              echo "Cloudflare Worker is healthy and D1 is ready."
              exit 0
            fi
            echo "Attempt $i/30: health=$health ready=$ready"
            sleep 10
          done
          echo "::error::Cloudflare Worker did not become healthy within 5 minutes."
          exit 1

      - name: Verify protected API rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://onyx-framework.soheil-mozaffari.workers.dev/api/users)"
          test "$status" = "401"
