on:
  push:
    branches:
      - 'hardening/**'
      - 'fix/**'

permissions:
  contents: write

concurrency:
  group: onyx-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Regenerate Cargo.lock
        run: cargo update --workspace
      - name: Regenerate web package-lock.json
        working-directory: web-ui
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfiles
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock web-ui/package-lock.json; then
            echo 'Lockfiles already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock web-ui/package-lock.json web-ui/package.json
          git commit -m 'chore: refresh security dependency lockfiles'
          git push origin HEAD:${GITHUB_REF_NAME}